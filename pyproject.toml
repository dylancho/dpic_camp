[project]
name = "proven-scalability-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 네트워크를 타는 테스트 (기본 실행에서 제외)"]
addopts = "-m 'not live'"
